# evaluation-query-api: migra el esquema consulta con el rol migrador y atiende con el rol de aplicación, igual
# que en docker-compose.yml. Solo monta claves públicas.
apiVersion: v1
kind: Service
metadata:
  name: evaluation-query-api
spec:
  selector:
    app.kubernetes.io/name: evaluation-query-api
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-query-api
spec:
  replicas: 1
  # Una sola réplica que migra la base al arrancar: Recreate evita tener a la vez el pod viejo y el nuevo (y su
  # memoria). 30 min de margen: el pod espera a sus dependencias y el primer arranque en Docker Desktop es lento.
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-query-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-query-api
    spec:
      # Sin variables *_PORT/*_SERVICE_HOST inyectadas por cada Service: "scoring-api" generaría
      # SCORING_API_PORT=tcp://..., que choca con server.port=${SCORING_API_PORT:8080}. Se usa DNS.
      enableServiceLinks: false
      initContainers:
        # Equivale a depends_on: consulta-preparar (completed). El rol migrador solo puede iniciar sesión cuando
        # el Job ya creó el esquema consulta y asignó las contraseñas (ambos ocurren en ese Job).
        - name: esperar-consulta-preparar
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until PGPASSWORD="$CONSULTA_MIGRADOR_PASSWORD" psql -h postgres -U "$CONSULTA_MIGRADOR_USER"
              -d "$POSTGRES_DB" -tAc "SELECT 1 FROM pg_namespace WHERE nspname = 'consulta'" 2>/dev/null | grep -q 1;
              do echo 'Esperando el Job consulta-preparar...'; sleep 5; done
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: POSTGRES_DB}}
            - name: CONSULTA_MIGRADOR_USER
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CONSULTA_MIGRADOR_USER}}
            - name: CONSULTA_MIGRADOR_PASSWORD
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CONSULTA_MIGRADOR_PASSWORD}}
      containers:
        - name: evaluation-query-api
          image: crediticio/evaluation-query-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          env:
            # Equipo con poca memoria (Docker Desktop): heap acotado al límite del contenedor, GC serie (menos
            # memoria que G1 con una sola CPU efectiva) y compilación JIT de nivel 1 (arranque con menos CPU).
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
            - name: EVALUATION_QUERY_API_PORT
              value: "8082"
            - name: AUTH_JWT_ISSUER
              valueFrom: {configMapKeyRef: {name: crediticio-config, key: JWT_ISSUER}}
            - name: EVALUATION_QUERY_JWT_PUBLIC_KEY_LOCATION
              value: file:/claves/publicas/jwt-publica.pem
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: POSTGRES_DB}}
            - name: EVALUATION_QUERY_DB_URL
              value: postgresql://postgres:5432/$(POSTGRES_DB)
            - name: EVALUATION_QUERY_DB_USERNAME
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CONSULTA_APP_USER}}
            - name: EVALUATION_QUERY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CONSULTA_APP_PASSWORD}}
            - name: EVALUATION_QUERY_DB_SCHEMA
              value: consulta
            # Solo en este entorno local: migra con el rol migrador, no con el de la aplicación.
            - name: EVALUATION_QUERY_FLYWAY_MIGRAR_AL_ARRANCAR
              value: "true"
            - name: SPRING_FLYWAY_USER
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CONSULTA_MIGRADOR_USER}}
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CONSULTA_MIGRADOR_PASSWORD}}
            - name: EVALUATION_QUERY_SAGA_HABILITADA
              valueFrom: {configMapKeyRef: {name: crediticio-config, key: SAGA_HABILITADA}}
            - name: SCORING_SERVICE_JWT_ISSUER
              value: scoring-api
            - name: SCORING_SERVICE_JWT_KEY_ID
              valueFrom: {configMapKeyRef: {name: crediticio-config, key: SCORING_SERVICE_JWT_KEY_ID}}
            - name: SCORING_SERVICE_JWT_PUBLIC_KEY_LOCATION
              value: file:/claves/publicas/scoring-service-public.pem
            - name: CORS_ALLOWED_ORIGINS
              valueFrom: {configMapKeyRef: {name: crediticio-config, key: CORS_ALLOWED_ORIGINS}}
            # Métricas (evaluation-query-api/docs/operacion/seguridad-metricas-prometheus.md).
            - name: EVALUATION_QUERY_METRICS_ENABLED
              value: "true"
            - name: EVALUATION_QUERY_METRICS_USERNAME
              valueFrom: {configMapKeyRef: {name: crediticio-config, key: METRICS_SCRAPER_USER}}
            - name: EVALUATION_QUERY_METRICS_PASSWORD
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: METRICS_SCRAPER_PASSWORD}}
          volumeMounts:
            - name: claves-publicas
              mountPath: /claves/publicas
              readOnly: true
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Vida: solo que la JVM acepte conexiones (tcpSocket). No usa /actuator/health porque incluye la base de
          # datos: una base lenta o caída reiniciaría la API sin motivo. Disponibilidad sí la usa (sale del tráfico).
          livenessProbe:
            tcpSocket: {port: http}
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: claves-publicas
          secret:
            secretName: claves-publicas
            defaultMode: 0444
