# Asegura en cada despliegue el rol de scoring-api y auth-api (lo crea si falta y sincroniza su contraseña con el
# Secret). Necesario porque initdb/01-rol-crediticio.sh solo corre con el volumen vacío: si esa primera
# inicialización se interrumpe, PostgreSQL queda con datos pero sin el rol. desplegar.ps1 recrea este Job en cada
# ejecución (un Job no admite cambios una vez creado); el script es seguro de repetir.
apiVersion: batch/v1
kind: Job
metadata:
  name: rol-crediticio
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rol-crediticio
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: asegurar-rol
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/asegurar-rol-crediticio.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: POSTGRES_DB}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: POSTGRES_ADMIN_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: POSTGRES_ADMIN_PASSWORD}}
            - name: CREDITICIO_DB_USER
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CREDITICIO_DB_USER}}
            - name: CREDITICIO_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: crediticio-credenciales, key: CREDITICIO_DB_PASSWORD}}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: scripts-postgres
