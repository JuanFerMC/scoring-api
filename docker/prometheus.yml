global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "scoring-api"
    metrics_path: "/actuator/prometheus"
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:9090"]
    basic_auth:
      username: "prometheus-scraper"
      password_file: /run/secrets/prometheus_password
