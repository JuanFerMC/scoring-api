name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration-tests:
    name: ${{ matrix.test_class }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - test_class: SolicitanteRepositoryAdapterIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it'
          - test_class: VariableRiesgoRepositoryAdapterIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it'
          - test_class: ReglaScoringRepositoryAdapterIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it'
          - test_class: EvaluacionRepositoryAdapterIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it -Dit.esquema-dedicado=hu12_it -Dspring.flyway.schemas=hu12_it -Dspring.datasource.url=jdbc:postgresql://localhost:5432/motor_scoring_it?currentSchema=hu12_it'
          - test_class: ClasificacionEvaluacionIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it -Dit.esquema-dedicado=hu12_clasificacion_it -Dspring.flyway.schemas=hu12_clasificacion_it -Dspring.datasource.url=jdbc:postgresql://localhost:5432/motor_scoring_it?currentSchema=hu12_clasificacion_it'
          - test_class: EvaluacionV8MigracionIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it'
          - test_class: TrabajoRecomendacionAdapterIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it'
          - test_class: TrabajoRecomendacionV11MigracionIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it'
          - test_class: PoliticaClasificacionRepositoryAdapterIT
            maven_args: '-Dhu11.it.base-dedicada=motor_scoring_it -Dhu11.it.esquema-dedicado=hu11_d2_it -Dspring.flyway.schemas=hu11_d2_it -Dspring.datasource.url=jdbc:postgresql://localhost:5432/motor_scoring_it?currentSchema=hu11_d2_it'
          - test_class: PoliticaClasificacionV7MigracionIT
            maven_args: '-Dhu11.it.base-dedicada=motor_scoring_it'
          - test_class: PoliticaClasificacionV9MigracionIT
            maven_args: '-Dit.base-dedicada=motor_scoring_it'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: motor_scoring_it
          POSTGRES_USER: scoring_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoring_ci -d motor_scoring_it"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_USERNAME: scoring_ci
      DB_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run isolated PostgreSQL integration test
        shell: bash
        run: |
          set -euo pipefail
          read -r -a extra_args <<< "${{ matrix.maven_args }}"
          ./mvnw -B -ntp test-compile failsafe:integration-test failsafe:verify "-Dit.test=${{ matrix.test_class }}" "-Dspring.profiles.active=it" "-Dspring.datasource.url=jdbc:postgresql://localhost:5432/motor_scoring_it" "${extra_args[@]}"

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-${{ matrix.test_class }}-${{ github.run_id }}
          path: target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
