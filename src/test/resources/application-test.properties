spring.datasource.url=jdbc:h2:mem:scoring-test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false

# La clave pública se genera en tiempo de ejecución en cada prueba que arranca el contexto (ClavesRsaPrueba).
scoring.jwt.emisor=auth-api-prueba
